<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Skillversity Support Portal</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 36px 30px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-header img {
      height: 48px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .brand-header h2 {
      font-size: 1.25rem;
      color: #1e293b;
      margin-top: 4px;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <img src="images/skillversity-logo.png" alt="Skillversity Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'40\' viewBox=\'0 0 200 40\'><text x=\'10\' y=\'30\' font-family=\'Arial\' font-size=\'22\' font-weight=\'bold\' fill=\'%232563eb\'>Skillversity</text></svg>'">
      <h2>Admin Portal Login</h2>
      <p>IT Support & Complaint Management System</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter admin username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div id="login-error" style="display: none; color: var(--danger); font-size: 0.85rem; margin-bottom: 14px; text-align: center;"></div>

      <button type="submit" id="loginBtn" class="btn btn-primary btn-full">
        🔐 Login to Dashboard
      </button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
      <a href="index.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">&larr; Back to Employee Complaint Form</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const loginBtn = document.getElementById('loginBtn');
      const errEl = document.getElementById('login-error');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Authenticating...';
      errEl.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.setItem('skillversity_token', data.token);
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          errEl.textContent = data.error || 'Invalid credentials';
          errEl.style.display = 'block';
        }
      } catch (err) {
        errEl.textContent = 'Network error during login.';
        errEl.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '🔐 Login to Dashboard';
      }
    }
  </script>
</body>
</html>
